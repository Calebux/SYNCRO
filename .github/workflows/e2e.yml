name: E2E Tests

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - 'shared/**'
      - '.github/workflows/e2e.yml'
  workflow_dispatch:
    inputs:
      force_full_run:
        description: 'Force a full E2E run'
        type: boolean
        default: false

jobs:
  playwright:
    name: Playwright E2E (Desktop + Mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install dependencies
        working-directory: client
        run: npm ci

      - name: Install Playwright browsers
        working-directory: client
        run: npx playwright install --with-deps

      - name: Get preview URL
        id: preview
        env:
          PREVIEW_URL: ${{ secrets.E2E_BASE_URL }}
        run: |
          if [ -n "$PREVIEW_URL" ]; then
            echo "E2E_BASE_URL=$PREVIEW_URL" >> $GITHUB_OUTPUT
          elif [ -n "${{ github.event.number }}" ]; then
            echo "E2E_BASE_URL=https://pr-${{ github.event.number }}--syncro.vercel.app" >> $GITHUB_OUTPUT
          else
            echo "E2E_BASE_URL must be set for manually dispatched runs" >&2
            exit 1
          fi

      - name: Wait for preview deployment
        env:
          E2E_BASE_URL: ${{ steps.preview.outputs.E2E_BASE_URL }}
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent --output /dev/null --max-time 10 "$E2E_BASE_URL"; then
              exit 0
            fi
            sleep 10
          done
          echo "Preview did not become available at $E2E_BASE_URL" >&2
          exit 1

      - name: Run Playwright tests
        working-directory: client
        env:
          CI: true
          E2E_BASE_URL: ${{ steps.preview.outputs.E2E_BASE_URL }}
        # Chromium only: keeps the v3 journey under its three-minute budget.
        run: npx playwright test --project=chromium

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: client/playwright-report/
          retention-days: 14

      - name: Upload failure screenshots and traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-test-results
          path: client/test-results/
          retention-days: 14
