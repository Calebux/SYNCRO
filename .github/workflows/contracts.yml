name: Contracts

nn:
    push:
        branches: [main]
        paths:
            - "contracts/**"
    pull_request:
        branches: [main]
        paths:
            - "contracts/**"

permissions:
    contents: read

concurrency:
    group: contracts-${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build-contracts:
        runs-on: ubuntu-latest
        timeout-minutes: 20
        defaults:
            run:
                working-directory: contracts

        steps:
            - uses: actions/checkout@v7

            - name: Install Rust
              uses: dtolnay/rust-toolchain@stable
              with:
                  targets: wasm32-unknown-unknown

            - name: Cache Rust dependencies
              uses: Swatinem/rust-cache@v2
              with:
                  workspaces: contracts

            - name: Build contracts
              run: cargo build --target wasm32-unknown-unknown --release

            - name: Verify deployment manifest wasm hashes
              shell: bash
              run: |
                  set -euo pipefail
                  if ! command -v jq >/dev/null 2>&1; then
                    echo "jq is required but not found" >&2
                    exit 1
                  fi
                  if [ ! -d deployments ]; then
                    echo "No deployments directory; skipping verification"
                    exit 0
                  fi
                  for manifest in deployments/*.json; do
                    [ -e "$manifest" ] || continue
                    echo "Checking $manifest"
                    # Contract names are top-level keys excluding metadata fields.
                    contracts=$(jq -r 'keys[]' "$manifest" | grep -Ev '^(network|chain_id|deploy_commit|deploy_timestamp)$' || true)
                    if [ -z "$contracts" ]; then
                      echo "ERROR: No contract entries found in $manifest" >&2
                      exit 1
                    fi
                    while IFS= read -r contract; do
                      expected_hash=$(jq -r --arg c "$contract" '.[$c].wasm_hash' "$manifest")
                      if [ -z "$expected_hash" ] || [ "$expected_hash" = "null" ]; then
                        echo "ERROR: No wasm_hash found for contract $contract in $manifest" >&2
                        exit 1
                      fi
                      wasm_file="target/wasm32-unknown-unknown/release/${contract}.wasm"
                      if [ ! -f "$wasm_file" ]; then
                        echo "ERROR: Built artifact $wasm_file not found for contract $contract" >&2
                        exit 1
                      fi
                      actual_hash=$(sha256sum "$wasm_file" | awk '{print $1}')
                      if [ "$expected_hash" != "$actual_hash" ]; then
                        echo "ERROR: $manifest records wasm_hash $expected_hash for $contract but built artifact is $actual_hash" >&2
                        exit 1
                      fi
                      echo "OK: $contract matches ($actual_hash)"
                    done <<< "$contracts"
                  done

            - name: Check snapshot layout (no flat snapshots outside test/ subdir)
              shell: bash
              run: |
                  set -euo pipefail
                  # Snapshots must live under {contract}/test_snapshots/test/
                  # Flat JSON files directly in test_snapshots/ indicate a misconfigured Env path
                  flat=$(find contracts -maxdepth 2 -name "test_snapshots" -type d \
                    | xargs -I {} find {} -maxdepth 1 -name "*.json" 2>/dev/null || true)
                  if [ -n "$flat" ]; then
                    echo "ERROR: snapshot files found directly in test_snapshots/ (missing test/ subdir):"
                    echo "$flat"
                    exit 1
                  fi
                  echo "Snapshot layout OK"

            - name: Run contract tests
              run: cargo test

            - name: Run contract fuzz tests
              run: cargo test -p subscription_renewal -p escrow -p payment-channel -p virtual-card fuzz_
              env:
                  PROPTEST_CASES: "8"

            - name: Verify backend contract interface alignment
              working-directory: ..
              run: |
                npm ci --legacy-peer-deps --ignore-scripts --workspace=@syncro:/backend --workspace=@syncro/shared 2>/dev/null || npm install --legacy-peer-deps --ignore-scripts --workspace=@syncro/backend --workspace=@syncro:/shared
                npm test -w @syncro/backend -- tests/integration/contract-interface-drift.tst

            - name: Check contract sizes
              shell: bash
              run: |
                  set -euo pipefail
                  shopt -s nullglob
                  
                  wasm_files=(target/wasm32-unknown-unknown/release/*.wasm)
                  
                  if [ "${#wasm_files[@]}" -eq 0 ]; then
                    echo "No WASM artifacts found in target/wasm32-unknown-unknown/release"
                    exit 1
                  fi
                  
                  for wasm in "${wasm_files[@]}"; do
                    size=$(wc -c < "$wasm")
                    echo "$wasm: ${size} bytes"
                    
                    if [ "$size" -gt 65536 ]; then
                      echo "WARNING: Contract exceeds 64KB limit"
                    fi
                  done
