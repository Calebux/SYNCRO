name: SDK package

on:
  pull_request:
    paths:
      - 'sdk/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sdk-package.yml'
  push:
    branches: [main]
    paths:
      - 'sdk/**'
      - 'shared/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/sdk-package.yml'

jobs:
  layout:
    name: Dual build · publint · tree-shake · size
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts || npm install --legacy-peer-deps --ignore-scripts

      - name: Generate types and build SDK
        run: |
          npm run generate -w shared
          npm run build -w shared
          npm run check:gateway-taxonomy -w sdk
          npm run build -w sdk

      - name: Package layout (publint + ESM/CJS/bundler/node16)
        run: npm run check:layout -w sdk

      - name: Tree-shake fixture
        run: npm run check:tree-shake -w sdk

      - name: Published size budget
        run: npm run check:size -w sdk

      - name: Record size in job summary
        if: always()
        run: |
          {
            echo "## @syncro/sdk package size"
            echo ""
            echo '```'
            npm run check:size -w sdk --silent || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  browser-tests:
    name: SDK browser tests · ${{ matrix.browser }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox, webkit]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --ignore-scripts || npm install --legacy-peer-deps --ignore-scripts

      - name: Install Playwright browser
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Run SDK browser tests
        run: npm run test:browser:playwright -w sdk -- --project=${{ matrix.browser }}
