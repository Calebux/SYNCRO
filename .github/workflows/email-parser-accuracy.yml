name: Email Parser Accuracy

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Issue #1280: email parsing accuracy is the product's core value proposition,
# so a regression in precision, recall or per-field accuracy must fail the build
# rather than land unnoticed. The corpus is fully redacted and the harness runs
# offline — no LLM call, no network, no secrets.
jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      parser: ${{ steps.filter.outputs.parser }}
    steps:
      - uses: actions/checkout@v7
      - uses: dorny/paths-filter@v4
        id: filter
        with:
          filters: |
            parser:
              - 'backend/src/services/email-parser.ts'
              - 'backend/src/services/llm-parser.ts'
              - 'backend/utils/merchant-normalizer.ts'
              - 'backend/tests/fixtures/email-corpus/**'
              - 'backend/tests/helpers/email-corpus.ts'
              - 'backend/tests/email-parser-corpus.test.ts'
              - 'backend/tests/email-corpus-redaction.test.ts'
              - '.github/workflows/email-parser-accuracy.yml'

  accuracy:
    name: Corpus accuracy gate
    runs-on: ubuntu-latest
    needs: changes
    if: ${{ github.event_name == 'workflow_dispatch' || needs.changes.outputs.parser == 'true' }}
    defaults:
      run:
        working-directory: backend
    env:
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Verify the corpus contains no personal data
        run: npx jest tests/email-corpus-redaction.test.ts --ci

      # The harness appends its Markdown report to $GITHUB_STEP_SUMMARY itself,
      # so the table shows up on the job page whether it passes or fails.
      - name: Score parser against the golden corpus
        run: npx jest tests/email-parser-corpus.test.ts --ci

      - name: Explain a regression
        if: failure()
        run: |
          {
            echo "### Accuracy gate failed"
            echo
            echo "Parsing accuracy dropped below the committed baseline in"
            echo '`backend/tests/fixtures/email-corpus/baseline.json`.'
            echo
            echo "The baseline is a measured floor, not a target. Fix the parser."
            echo "Only regenerate the baseline when accuracy genuinely improves:"
            echo
            echo '```'
            echo 'npx ts-node backend/scripts/update-email-corpus-baseline.ts'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
