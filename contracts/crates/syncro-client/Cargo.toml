[package]
name = "syncro-client"
version = "0.1.0"
edition = "2021"
publish = false
description = """
Rust client for Syncro payment-gated APIs.

Wraps reqwest with automatic HTTP-402 handling, payment-proof signing, and
receipt verification.  Shares channel-state encoding with the on-chain
payment-channel contract via the syncro-channel-state crate.
"""

[lib]
crate-type = ["rlib"]

[dependencies]
syncro-channel-state = { path = "../channel-state", features = ["signing"] }
reqwest  = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde    = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0" }
tokio    = { version = "1", features = ["rt-multi-thread", "macros"] }
hex      = { version = "0.4" }
base64   = { version = "0.22" }
thiserror = { version = "1" }
hmac     = { version = "0.12", default-features = false }
sha2     = { version = "0.10", default-features = false }

[dev-dependencies]
tokio    = { version = "1", features = ["rt-multi-thread", "macros", "test-util"] }
