[package]
name = "payment-channel"
version = "0.1.0"
edition = "2021"

[dependencies]
soroban-sdk = { workspace = true }
syncro-contract-common = { package = "syncro-contract-common", path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
proptest = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
# Shared encoding crate: gives the contract's vector tests access to the
# same encode_channel_state / sign_channel_state functions the client uses,
# verifying byte-for-byte compatibility without duplicating logic.
syncro-channel-state = { path = "../../crates/channel-state", features = ["signing"] }

