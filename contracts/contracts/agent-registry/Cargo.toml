edition = "2021"
publish = false

[lib]
crate-type = ["lib", "cdylib"]
doctest = false

[dependencies]
soroban-sdk = { workspace = true }
syncro-contract-common = { package = "syncro-contract-common", path = "../common" }

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
