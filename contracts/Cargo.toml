[workspace]
resolver = "2"
members = [
  "contracts",
  "contracts/common",
  "contracts/subscription_renewal",
  "contracts/subscription_logging",
  "contracts/virtual-card",
  "contracts/escrow",
  "contracts/agent-registry",
  "contracts/zk-payment-verifier",
  "contracts/payment-channel",
  "contracts/contract-upgrade",
  "contracts/allowance",
  "contracts/payment-adapter",
  "contracts/voucher-ledger",
  "contracts/fee-collector",
  "contracts/resolver-registry",
  "contracts/subscription_refund",
  "contracts/recurring_allowance",
  "contracts/loyalty_rewards",
  "contracts/subscription_nft",
  "contracts/attestation",
  "contracts/guardian",
  "contracts/fx-oracle",
  "contracts/payment-splitter",
  "contracts/stealth-announcement",
  "integration_tests",
]

[workspace.dependencies]
soroban-sdk = "=27.0.2"
proptest = "1.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true
