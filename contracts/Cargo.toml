# Reproducible builds: the Rust toolchain is pinned in rust-toolchain.toml.
# All CI builds use --locked so Cargo.lock is authoritative.
# Run `bash scripts/build-reproducible.sh` to reproduce hashes locally.
[workspace]
resolver = "2"
members = [
  "common",
  "contracts/subscription-registry",
  "contracts/common",
  "contracts/subscription-renewal",
  "contracts/subscription-logging",
  "contracts/virtual-card",
  "contracts/escrow",
  "contracts/agent-registry",
  "contracts/zk-payment-verifier",
  "contracts/payment-channel",
  "contracts/contract-upgrade",
  "contracts/allowance",
  "contracts/payment-adapter",
  "contracts/voucher-ledger",
  "contracts/fee-collector",
  "contracts/resolver-registry",
  "contracts/subscription-refund",
  "contracts/recurring-allowance",
  "contracts/loyalty-rewards",
  "contracts/subscription-nft",
  "contracts/attestation",
  "contracts/guardian",
  "contracts/fx-oracle",
  "contracts/payment-splitter",
  "contracts/stealth-announcement",
  "integration-tests",
]

[workspace.dependencies]
soroban-sdk = "=28.0.0"
proptest = "1.6"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

# For more information about this profile see https://soroban.stellar.org/docs/basic-tutorials/logging#cargotoml-profile
[profile.release-with-logs]
inherits = "release"
debug-assertions = true

[workspace.dependencies.base64ct]
version = "=1.6.0"
